[package]
name = "oxagent"
description = "oxrdp Windows guest agent: captures app windows (WGC), encodes (Media Foundation), and serves the oxproto stream. Windows-only."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
oxproto = { path = "../oxproto" }
oxtransport = { path = "../oxtransport" }
oxsec = { path = "../oxsec" }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    # WinRT surface used by Windows.Graphics.Capture
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    # D3D11 device + staging-texture readback
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # WinRT <-> Win32 interop (capture item from an HWND, D3D device bridging)
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Com",
    # Window enumeration / geometry / DPI
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    # Input injection (P3)
    "Win32_UI_Input_KeyboardAndMouse",
    # Encoding (P5)
    "Win32_Media_MediaFoundation",
] }

[lints]
workspace = true
