[package]
name = "oxclient"
description = "Linux client session: connects to the oxagent, performs the oxproto handshake, and yields window/frame events."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
oxproto = { path = "../oxproto" }
oxtransport = { path = "../oxtransport" }
oxsec = { path = "../oxsec" }

[[bin]]
name = "oxclient"
path = "src/main.rs"

[lints]
workspace = true
