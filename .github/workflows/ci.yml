name: CI
on:
  push:
    branches: [main]
    # A commit touching only prose cannot break a build, and this workflow runs six jobs across
    # two architectures plus a Windows cross-compile. Much of this repository's history is
    # documentation, so running all of that to prove a paragraph still compiles is waste.
    # Anything under `docs/design/` that a test actually enforces is enforced by conformance
    # vectors in `crates/`, which are not ignored here.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pre-alpha guard: until the Cargo workspace lands (M0), there is nothing to
      # build/lint. Skip cleanly so CI stays green instead of red-X'ing every push.
      - id: guard
        run: |
          if [ -f Cargo.toml ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "no Cargo workspace yet — skipping"; echo "go=0" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.go == '1'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # `openh264` (pulled in by oxclient's default `h264` feature) vendors and compiles a C
      # library, which otherwise dominates every cold `cargo clippy --workspace` run here.
      - if: steps.guard.outputs.go == '1'
        uses: Swatinem/rust-cache@v2
      - if: steps.guard.outputs.go == '1'
        run: cargo fmt --all -- --check
      - if: steps.guard.outputs.go == '1'
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: ["ubuntu-latest", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@v5
      - id: guard
        run: |
          if [ -f Cargo.toml ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "no Cargo workspace yet — skipping"; echo "go=0" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.go == '1'
        uses: dtolnay/rust-toolchain@stable
      # Keyed per matrix arm: an ARM cache is useless (and would just be evicted) on the x86_64
      # runner and vice versa.
      - if: steps.guard.outputs.go == '1'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.runner }}
      # System libs the display/render/input shells need to build (X11, Wayland,
      # xkbcommon, VA-API). Harmless no-op for the pure core crates.
      - if: steps.guard.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libva-dev
      - if: steps.guard.outputs.go == '1'
        run: cargo build --workspace
      - if: steps.guard.outputs.go == '1'
        run: cargo test --workspace
      # `h264` is on by default for oxclient and vendors + compiles `openh264` (a C library) via
      # `openh264-sys2`. This build must keep passing without it: turning the feature off is
      # what lets the validated RAW_BGRA bring-up path survive on a machine where the codec
      # cannot build, and the default build staying green does not prove this one still does —
      # see the `h264` feature doc in `crates/oxclient/Cargo.toml`.
      - if: steps.guard.outputs.go == '1'
        run: cargo test -p oxclient --no-default-features

  # The Windows guest agent is the component that matters most and never builds on a Linux
  # runner's default target — without this job it can break while CI stays green.
  agent-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      # A distinct cache namespace from `test`'s ubuntu-latest run: same runner OS, different
      # target triple, so sharing a key would mix host and cross-compiled artifacts for nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent-windows
      - name: Install the mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
      - run: cargo build -p oxagent --target x86_64-pc-windows-gnu
      - run: cargo clippy -p oxagent --target x86_64-pc-windows-gnu --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `cargo audit` directly rather than rustsec/audit-check: that action posts its result as
      # a check run, which needs `checks: write`, and this workflow's token is deliberately
      # read-only. Widening the token so an advisory scan can draw a nicer annotation is a bad
      # trade — the findings are just as readable in the job log, and a failing step fails the
      # job either way. It also removes a third-party action from a security-critical path.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Not `--deny warnings`: the tree currently carries RUSTSEC-2026-0192, ttf-parser
      # unmaintained, reached only through winit's Wayland decorations. That is not a
      # vulnerability and nothing here can act on it, so failing the build over it would trade
      # one permanently-red job for another. Plain `cargo audit` fails on actual advisories.
      - run: cargo audit

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
