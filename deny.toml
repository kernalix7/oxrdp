# cargo-deny policy. Enforced in CI (`cargo deny check bans licenses sources`).
#
# The dependency surface grew sharply with the pivot (windows-rs pulls a large tree), so
# licenses and sources are gated rather than reviewed by hand.

[advisories]
yanked = "deny"

[licenses]
# The project is MIT; only permissive licenses may be linked in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# ring's license file is a composite (ISC-style + OpenSSL/BoringSSL heritage) that the
# SPDX scanners cannot classify; it is a well-known permissive case.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
# A genuine unpinned `"*"` dependency on a crates.io crate accepts whatever version is published
# next — including one published by whoever compromises that crate. That is a supply-chain
# hazard and stays a hard failure.
wildcards = "deny"
# Our crates depend on each other by `path` with no `version =`, which cargo-deny cannot tell
# apart from a wildcard without this. It exempts that pattern *only* for crates marked
# `publish = false`, which every workspace member now is — accurate rather than a workaround,
# since publishing is deliberately deferred. It never exempts a real crates.io wildcard, which
# is why `wildcards` above can be `deny` rather than the `warn` it was while our own crate graph
# was tripping it.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
